name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-mode:
    runs-on: ubuntu-latest
    outputs:
      generated_release_push: ${{ steps.classify.outputs.generated_release_push }}
      web_only: ${{ steps.classify.outputs.web_only }}
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify CI mode
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          HEAD_REF: ${{ github.head_ref || '' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail
          PATHS_FILE="$RUNNER_TEMP/ci-changed-paths"
          DIFF_AVAILABLE=true
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || ! git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$PATHS_FILE"; then
            DIFF_AVAILABLE=false
            : > "$PATHS_FILE"
          fi
          MERGE_PARENTS="$(git show -s --format=%P "$GITHUB_SHA" | wc -w)"
          MODE_JSON="$(node script/ci-fast-path.mjs --event "$GITHUB_EVENT_NAME" --message "$HEAD_COMMIT_MESSAGE" --diff-available "$DIFF_AVAILABLE" --merge-parents "$MERGE_PARENTS" --head-ref "$HEAD_REF" --labels "${PR_LABELS:-[]}" < "$PATHS_FILE")"
          jq -r '"generated_release_push=\(.generatedReleasePush)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"web_only=\(.webOnly)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"run_heavy=\(.runHeavy)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
          jq -r '"full_matrix=\(.fullMatrix)"' <<< "$MODE_JSON" >> "$GITHUB_OUTPUT"
      - name: Write job summary
        if: always()
        run: echo "## CI execution mode" >> "$GITHUB_STEP_SUMMARY"

  block-master-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$BASE_REF" != "master" ]; then exit 0; fi
          gh pr comment "$PR_URL" --body "Hi @${PR_AUTHOR}, please retarget this pull request to \\`dev\\`."
          gh pr close "$PR_URL"
          exit 1
      - name: Write job summary
        if: always()
        run: echo "## PR target guard" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: [ci-mode]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: "1/2"
          - os: ubuntu-latest
            shard: "2/2"
          - os: macos-latest
            shard: "1/2"
          - os: macos-latest
            shard: "2/2"
          - os: windows-latest
            shard: "1/2"
          - os: windows-latest
            shard: "2/2"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun install --frozen-lockfile
      - name: Run OpenCode tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os != 'Windows' && matrix.shard == '1/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun test --timeout 20000 packages/omo-opencode packages/memory-core
      - name: Run OpenCode tests with Windows telemetry
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os == 'Windows' && matrix.shard == '1/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        shell: pwsh
        run: bun test --timeout 20000 packages/omo-opencode packages/memory-core
      - name: Run shared tests
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os != 'Windows' && matrix.shard == '2/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        run: bun --config=bunfig.win2.parallel.toml test --timeout 20000
      - name: Run shared tests with Windows telemetry
        if: needs.ci-mode.outputs.run_heavy == 'true' && runner.os == 'Windows' && matrix.shard == '2/2' && (matrix.os == 'ubuntu-latest' || needs.ci-mode.outputs.full_matrix == 'true')
        shell: pwsh
        run: bun --config=bunfig.win2.parallel.toml test --timeout 20000 --parallel
      - name: Write job summary
        if: always()
        run: echo "## Root test suite (${{ matrix.os }}, ${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run typecheck
      - name: Write job summary
        if: always()
        run: echo "## TypeScript checks" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [ci-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        if: needs.ci-mode.outputs.run_heavy == 'true'
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run build
      - name: Verify build output
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: test -f dist/index.js && test -f dist/index.d.ts
      - name: Verify generated schema artifacts are committed
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: bun run build:schema && bun run build:omo-schema && git diff --exit-code -- assets/omo-hustler.schema.json assets/omo.schema.json
      - name: Verify generated schemas
        if: needs.ci-mode.outputs.run_heavy == 'true'
        run: git diff --exit-code -- assets/omo-hustler.schema.json assets/omo.schema.json
      - name: Write job summary
        if: always()
        run: echo "## Root build" >> "$GITHUB_STEP_SUMMARY"

  auto-commit-schema:
    runs-on: ubuntu-latest
    needs: [ci-mode, test, typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Auto-commit schema changes
        run: |
          if git diff --quiet assets/omo-hustler.schema.json assets/omo.schema.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/omo-hustler.schema.json assets/omo.schema.json
          git commit -m "chore: auto-update schema.json"
          git push
      - name: Write job summary
        if: always()
        run: echo "## Schema auto-commit" >> "$GITHUB_STEP_SUMMARY"
