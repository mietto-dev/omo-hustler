name: Windows flake soak

on:
  workflow_dispatch:
    inputs:
      target:
        description: Focused Windows test target to repeat
        required: true
        type: choice
        options:
          - team-message
          - facts-lock
          - reply-listener
      iterations:
        description: Number of identical iterations to run
        required: true
        default: 10
        type: number
      test_ref:
        description: Git ref whose repository contents should be tested
        required: false
        type: string

permissions:
  contents: read

jobs:
  soak:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run allowlisted target repeatedly
        id: run-soak
        shell: pwsh
        env:
          SOAK_TARGET: ${{ inputs.target }}
          SOAK_ITERATIONS: ${{ inputs.iterations }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          "iterations_ran=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failed_iteration=none" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $targets = @{
            "team-message" = @("test", "packages/omo-opencode/src/features/team-mode/tools/messaging.test.ts")
            "facts-lock" = @("test", "packages/memory-core/src/locks", "packages/omo-opencode/src/features/memory/commands/facts.test.ts")
            "reply-listener" = @("test", "packages/openclaw-core/src/__tests__/reply-listener-startup.test.ts")
          }
          $target = $env:SOAK_TARGET
          if (-not $targets.ContainsKey($target)) { Write-Error "Windows soak target is not allowlisted"; exit 1 }
          $iterationCount = 0
          if (-not [int]::TryParse($env:SOAK_ITERATIONS, [ref]$iterationCount) -or $iterationCount -lt 1 -or $iterationCount -gt 50) {
            Write-Error "Windows soak iterations must be an integer from 1 to 50"
            exit 1
          }
          for ($iteration = 1; $iteration -le $iterationCount; $iteration++) {
            "iterations_ran=$iteration" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            & bun $targets[$target]
            if ($LASTEXITCODE -ne 0) {
              "failed_iteration=$iteration" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit $LASTEXITCODE
            }
          }
      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Windows flake soak (${{ inputs.target }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Selected target: `${{ inputs.target }}`.
            - Requested iterations: `${{ inputs.iterations }}`.
            - Iterations actually run: `${{ steps.run-soak.outputs.iterations_ran || '0' }}`.
            - Failed iteration: `${{ steps.run-soak.outputs.failed_iteration || 'none' }}`.
          JOB_SUMMARY_NEXT: Inspect the failing OpenCode/core test and rerun the same target locally.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
