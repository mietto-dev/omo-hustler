name: publish-hustler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run --cwd packages/hustler test
      - run: bun test packages/hustler script/package-layout.test.ts script/package-layout-exclusion.test.ts packages/hustler/src/identity/identity-manifest.test.ts packages/omo-opencode/src/mcp/lsp.test.ts
      - run: bun pm pack --dry-run --ignore-scripts
      - name: Write job summary
        if: always()
        run: echo "## Hustler package release dry run" >> "$GITHUB_STEP_SUMMARY"
